<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title">Daan</title>
    <link rel="stylesheet" href="./assets/css/style.css" />

    <!-- Icons for the custom video controls -->
    <link rel="stylesheet" href="./fontawesome/css/all.min.css" />

    <style>
      body {
        background-image: url("./assets/images/bg-image.png");
      }

      /* =========================================
         THEME
         ========================================= */
      :root {
        --daan-green: #89bf2d;
        --daan-pink: #ff4ec6;
      }

      /* =========================================
         PLAY VIDEO BUTTON  (bottom left)
         ========================================= */
.video-play-btn {
  position: fixed;
  bottom: 2vw;
  left: 4vw;
  z-index: 1000;
  display: inline-flex;
  align-items: center;
  gap: 0.9vw;
  padding: 0.6vw 1.8vw 0.6vw 0.6vw;
  width: 12vw;
  height: 4vw;
  background-image: url("./assets/images/watch.png");
  background-position: center;
  background-repeat: no-repeat;
  background-size: contain;
  cursor: pointer;
  pointer-events: auto;

  transform-origin: center center;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);

  /* pops in on load, then breathes gently */
  animation:
    btnPopIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both,
    btnBreathe 2.6s ease-in-out 0.9s infinite;
}

.video-play-btn:hover {
  transform: scale(1.08);
  animation-play-state: paused;
}

.video-play-btn:active {
  transform: scale(0.95);
}

@keyframes btnPopIn {
  0% {
    opacity: 0;
    transform: scale(0.4) translateY(1.5vw);
  }
  60% {
    opacity: 1;
    transform: scale(1.12) translateY(0);
  }
  100% {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

@keyframes btnBreathe {
  0%,
  100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}

@media (prefers-reduced-motion: reduce) {
  .video-play-btn {
    animation: none;
    opacity: 1;
  }
}

      

      .video-play-btn:focus-visible {
        outline: 0.25vw solid var(--daan-pink);
        outline-offset: 0.3vw;
      }

      

      .video-play-btn > span {
        color: #ffffff;
        font-size: 1.4vw;
        font-weight: 700;
        letter-spacing: 0.03vw;
        white-space: nowrap;
        line-height: 1;
      padding: 0.2vw;
      padding-left: 3.6vw;
              font-family: "BalooRegular";

      }

      body[data-lang="hi"] .video-play-btn > span,
      body[data-lang="gu"] .video-play-btn > span {
        font-size: 1.35vw;
      }

      /* =========================================
         VIDEO POPUP
         ========================================= */
      body.video-open main,
      body.video-open .language-container {
        filter: blur(0.5vw);
        pointer-events: none;
        user-select: none;
      }

      main,
      .language-container {
        transition: filter 0.4s ease;
      }

      body.video-open .video-play-btn {
        opacity: 0;
        pointer-events: none;
      }

      .video-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.42);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      .video-overlay.show {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .video-box {
        position: relative;
        width: 68vw;
        aspect-ratio: 16 / 9;
        border-radius: 1.1vw;
        border: 0.3vw solid var(--daan-green);
        background: #000;
        transform: scale(0.82);
        opacity: 0;
        box-shadow: 0 1vw 3vw rgba(0, 0, 0, 0.45);
        transition:
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.35s ease;
      }

      .video-overlay.show .video-box {
        transform: scale(1);
        opacity: 1;
      }

      .close-video {
        position: absolute;
        top: -1.5vw;
        right: -1.5vw;
        width: 3.2vw;
        height: 3.2vw;
        border: 0.2vw solid #ffffff;
        border-radius: 50%;
        background: var(--daan-pink);
        color: #ffffff;
        font-size: 1.5vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        box-shadow: 0 0.35vw 1vw rgba(0, 0, 0, 0.35);
        transition:
          transform 0.25s ease,
          background 0.25s ease;
      }

      .close-video:hover {
        transform: rotate(90deg) scale(1.08);
        background: var(--daan-green);
      }

      .video-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 0.85vw;
        overflow: hidden;
        background: #000;
      }

      .popup-video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        background: #000;
      }

      /* ---------- Center play ---------- */
      .video-center-play {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6vw;
        min-width: 6vw;
        height: 6vw;
        border: 0.22vw solid #ffffff;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.4);
        color: var(--daan-pink);
        font-size: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transform: translate(-50%, -50%) scale(1);
        z-index: 4;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          background 0.25s ease;
      }

      .video-center-play i {
        width: 2.2vw;
        min-width: 2.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .video-center-play.hide {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(0.8);
      }

      .video-center-play:hover {
        background: rgba(0, 0, 0, 0.6);
        transform: translate(-50%, -50%) scale(1.08);
      }

      /* ---------- Skip toasts ---------- */
      .seek-toast {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        padding: 0.6vw 1.1vw;
        border-radius: 0.6vw;
        background: rgba(0, 0, 0, 0.6);
        color: var(--daan-pink);
        font-size: 1.1vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        opacity: 0;
        pointer-events: none;
        z-index: 6;
        transition: opacity 0.2s ease;
      }

      .seek-toast.show {
        opacity: 1;
      }

      .seek-toast.backward {
        left: 8%;
      }

      .seek-toast.forward {
        right: 8%;
      }

      /* ---------- Control bar ---------- */
      .custom-controls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        padding: 1vw;
        display: flex;
        flex-direction: column;
        gap: 0.75vw;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.85),
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0)
        );
        opacity: 1;
        transition: opacity 0.25s ease;
      }

      .video-frame.controls-hidden .custom-controls {
        opacity: 0;
        pointer-events: none;
      }

      .progress-wrap {
        width: 100%;
        display: flex;
        align-items: center;
        padding: 0.4vw 0;
        cursor: pointer;
      }

      /* Free seeking, forward and backward. */
      .video-progress {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 0.45vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
        overflow: hidden;
        transition: height 0.2s ease;
      }

      .progress-wrap:hover .video-progress {
        height: 0.65vw;
      }

      .video-progress::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 1vw;
        height: 1vw;
        border-radius: 50%;
        background: var(--daan-pink);
        box-shadow: -70vw 0 0 69.6vw var(--daan-pink);
        cursor: pointer;
      }

      .video-progress::-moz-range-thumb {
        width: 1vw;
        height: 1vw;
        border: none;
        border-radius: 50%;
        background: var(--daan-pink);
        cursor: pointer;
      }

      .video-progress::-moz-range-progress {
        height: 0.45vw;
        border-radius: 5vw;
        background: var(--daan-pink);
      }

      .control-row {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1vw;
      }

      .control-left,
      .control-right {
        display: flex;
        align-items: center;
        gap: 0.8vw;
      }

      .control-btn {
        width: 2.8vw;
        min-width: 2.8vw;
        height: 2.8vw;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        font-size: 1.2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.25s ease,
          color 0.25s ease,
          transform 0.25s ease;
      }

      .control-btn i {
        width: 1.4vw;
        min-width: 1.4vw;
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }

      .control-btn:hover {
        background: var(--daan-green);
        color: #ffffff;
        transform: scale(1.08);
      }

      .control-btn:focus-visible,
      .video-center-play:focus-visible,
      .close-video:focus-visible {
        outline: 0.2vw solid var(--daan-pink);
        outline-offset: 0.2vw;
      }

      .time-text {
        color: #ffffff;
        font-size: 1.05vw;
        font-weight: 700;
        font-family: Arial, sans-serif;
        letter-spacing: 0.05vw;
        min-width: 8vw;
      }

      .volume-range {
        width: 7vw;
        appearance: none;
        -webkit-appearance: none;
        height: 0.4vw;
        border-radius: 5vw;
        background: rgba(255, 255, 255, 0.35);
        cursor: pointer;
      }

      .volume-range::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.9vw;
        height: 0.9vw;
        border-radius: 50%;
        background: var(--daan-green);
        cursor: pointer;
      }

      .volume-range::-moz-range-thumb {
        width: 0.9vw;
        height: 0.9vw;
        border: none;
        border-radius: 50%;
        background: var(--daan-green);
        cursor: pointer;
      }

      /* ---------- Fullscreen ---------- */
      .video-box:fullscreen {
        width: 100%;
        height: 100%;
        border-radius: 0;
        border: none;
        background: #000;
      }

      .video-box:fullscreen .video-frame {
        border-radius: 0;
      }

      .video-box:fullscreen .close-video {
        top: 1.5vw;
        right: 1.5vw;
      }

     
    </style>
  </head>

  <body class="loaded">
    <div class="language-container">
      <div class="english active">E</div>
      <div class="hindi">H</div>
      <div class="gujarati">G</div>
    </div>

    <main>
      <div class="home-container">
        <div class="left-home-container">
          <div class="title">
            <span data-lang-key="title"></span>
            <!-- <span class="description" data-lang-key="description"></span> -->
          </div>

          <div class="hero-img-wrap">
            <div class="hero-img">
              <img src="./assets/images/home page_.png" alt="" />
            </div>
          </div>
        </div>

        <div class="right-home-container">
          <div class="topics">
            <a
              href="what-is-daan.html"
              class="topic topic-1"
              data-lang-key="title-1"
            ></a>

            <a
              href="why-should-we-give.html"
              class="topic topic-2"
              data-lang-key="title-2"
            ></a>

            <a
              href="what-can-we-give.html"
              class="topic topic-3"
              data-lang-key="title-3"
            ></a>

            <a
              href="types-of-daan.html"
              class="topic topic-4"
              data-lang-key="title-4"
            ></a>
          </div>
        </div>
      </div>
    </main>

    <!-- Play video button (bottom left) -->
    <div class="video-play-btn" id="videoPlayBtn" role="button" tabindex="0">
      <span data-lang-key="watch">Watch Video</span>
    </div>

    <!-- Video popup -->
    <div class="video-overlay" id="videoOverlay">
      <div class="video-box" id="videoBox">
        <button
          class="close-video"
          id="closeVideo"
          type="button"
          aria-label="Close video"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="video-frame" id="videoFrame">
          <video
            class="popup-video"
            id="popupVideo"
            preload="metadata"
            playsinline
            controlsList="nodownload noplaybackrate"
            disablePictureInPicture
          >
            <source src="./assets/videos/video.webm" type="video/mp4" />

            Your browser does not support the video tag.
          </video>

          <button
            class="video-center-play"
            id="centerPlayBtn"
            type="button"
            aria-label="Play video"
          >
            <i class="fa-solid fa-play"></i>
          </button>

          <div class="seek-toast backward">-10s</div>
          <div class="seek-toast forward">+10s</div>

          <div class="custom-controls">
            <div class="progress-wrap">
              <input
                class="video-progress"
                id="videoProgress"
                type="range"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Seek"
              />
            </div>

            <div class="control-row">
              <div class="control-left">
                <button
                  class="control-btn rewind-btn"
                  type="button"
                  aria-label="Back 10 seconds"
                >
                  <i class="fa-solid fa-backward"></i>
                </button>

                <button
                  class="control-btn play-pause-btn"
                  type="button"
                  aria-label="Play or pause"
                >
                  <i class="fa-solid fa-play"></i>
                </button>

                <button
                  class="control-btn forward-btn"
                  type="button"
                  aria-label="Forward 10 seconds"
                >
                  <i class="fa-solid fa-forward"></i>
                </button>

                <div class="time-text">
                  <span class="current-time">0:00</span>
                  /
                  <span class="total-time">0:00</span>
                </div>
              </div>

              <div class="control-right">
                <button
                  class="control-btn mute-btn"
                  type="button"
                  aria-label="Mute or unmute"
                >
                  <i class="fa-solid fa-volume-high"></i>
                </button>

                <input
                  class="volume-range"
                  type="range"
                  min="0"
                  max="1"
                  step="0.01"
                  value="1"
                  aria-label="Volume"
                />

                <button
                  class="control-btn fullscreen-btn"
                  type="button"
                  aria-label="Toggle fullscreen"
                >
                  <i class="fa-solid fa-expand"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Audios -->
    <audio id="topicAudio" src="./assets/audio/11.mp3" preload="auto"></audio>

    <audio id="engAudio" src="./assets/audio/Eng.mpeg" preload="auto"></audio>
    <audio id="hinAudio" src="./assets/audio/Hin.mpeg" preload="auto"></audio>
    <audio id="gujAudio" src="./assets/audio/Guj.mpeg" preload="auto"></audio>

    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/app.js"></script>
    <script src="./assets/js/djp.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const topicBtns = document.querySelectorAll(".topic");

        const englishBtn = document.querySelector(".english");
        const hindiBtn = document.querySelector(".hindi");
        const gujaratiBtn = document.querySelector(".gujarati");

        const topicAudio = document.getElementById("topicAudio");

        const engAudio = document.getElementById("engAudio");
        const hinAudio = document.getElementById("hinAudio");
        const gujAudio = document.getElementById("gujAudio");

        function stopAllAudio() {
          const audios = [topicAudio, engAudio, hinAudio, gujAudio];

          audios.forEach((audio) => {
            if (audio) {
              audio.pause();
              audio.currentTime = 0;
            }
          });
        }

        function playAudio(audio) {
          if (!audio) return;

          stopAllAudio();
          audio.currentTime = 0;

          const playPromise = audio.play();

          if (playPromise !== undefined) {
            playPromise.catch((error) => {
              console.log(
                "Audio not playing. Check file path or browser:",
                error,
              );
            });
          }
        }

        topicBtns.forEach((topicBtn) => {
          topicBtn.addEventListener("click", function (e) {
            e.preventDefault();

            playAudio(topicAudio);

            setTimeout(() => {
              window.location.href = this.href;
            }, 600);
          });
        });

        englishBtn?.addEventListener("click", () => {
          playAudio(engAudio);
        });

        hindiBtn?.addEventListener("click", () => {
          playAudio(hinAudio);
        });

        gujaratiBtn?.addEventListener("click", () => {
          playAudio(gujAudio);
        });

        /* =====================================================
           CUSTOM VIDEO PLAYER
           ===================================================== */
        const videoPlayBtn = document.getElementById("videoPlayBtn");
        const videoOverlay = document.getElementById("videoOverlay");
        const videoBox = document.getElementById("videoBox");
        const videoFrame = document.getElementById("videoFrame");
        const popupVideo = document.getElementById("popupVideo");
        const closeVideo = document.getElementById("closeVideo");

        const centerPlayBtn = document.getElementById("centerPlayBtn");
        const playPauseBtn = document.querySelector(".play-pause-btn");
        const rewindBtn = document.querySelector(".rewind-btn");
        const forwardBtn = document.querySelector(".forward-btn");

        const videoProgress = document.getElementById("videoProgress");
        const currentTimeText = document.querySelector(".current-time");
        const totalTimeText = document.querySelector(".total-time");

        const muteBtn = document.querySelector(".mute-btn");
        const volumeRange = document.querySelector(".volume-range");
        const fullscreenBtn = document.querySelector(".fullscreen-btn");

        const seekToastBack = document.querySelector(".seek-toast.backward");
        const seekToastFwd = document.querySelector(".seek-toast.forward");

        const playPauseIcon = playPauseBtn.querySelector("i");
        const centerPlayIcon = centerPlayBtn.querySelector("i");
        const muteIcon = muteBtn.querySelector("i");
        const fullscreenIcon = fullscreenBtn.querySelector("i");

        // Seeking is unrestricted in both directions.
        const SKIP_SECONDS = 10;

        let controlsTimer;
        let seekToastTimer;
        let lastVolume = 1;
        let isSeeking = false;

        function formatTime(time) {
          if (!time || isNaN(time)) return "0:00";

          const minutes = Math.floor(time / 60);
          const seconds = Math.floor(time % 60);

          return minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
        }

        function updatePlayIcons() {
          if (popupVideo.paused) {
            playPauseIcon.className = "fa-solid fa-play";
            centerPlayIcon.className = "fa-solid fa-play";
            centerPlayBtn.classList.remove("hide");
          } else {
            playPauseIcon.className = "fa-solid fa-pause";
            centerPlayIcon.className = "fa-solid fa-pause";
            centerPlayBtn.classList.add("hide");
          }
        }

        function togglePlay() {
          if (popupVideo.paused) {
            popupVideo.play().catch(() => {});
          } else {
            popupVideo.pause();
          }
        }

        function showControlsTemporarily() {
          videoFrame.classList.remove("controls-hidden");

          clearTimeout(controlsTimer);

          if (!popupVideo.paused && !isSeeking) {
            controlsTimer = setTimeout(() => {
              videoFrame.classList.add("controls-hidden");
            }, 2200);
          }
        }

        function openVideoPopup() {
          document.body.classList.add("video-open");
          videoOverlay.classList.add("show");

          popupVideo.currentTime = 0;
          popupVideo.volume = Number(volumeRange.value);
          popupVideo.muted = false;

          videoProgress.value = 0;
          currentTimeText.textContent = "0:00";

          updateMuteIcon();
          updatePlayIcons();
          showControlsTemporarily();

          setTimeout(() => {
            popupVideo.play().catch(() => {});
          }, 250);
        }

        function closeVideoPopup() {
          popupVideo.pause();
          popupVideo.currentTime = 0;

          videoProgress.value = 0;
          currentTimeText.textContent = "0:00";

          videoOverlay.classList.remove("show");
          document.body.classList.remove("video-open");

          if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
          }

          updatePlayIcons();
        }

        function updateProgress() {
          if (!popupVideo.duration) return;

          totalTimeText.textContent = formatTime(popupVideo.duration);

          if (isSeeking) return;

          videoProgress.value =
            (popupVideo.currentTime / popupVideo.duration) * 100;

          currentTimeText.textContent = formatTime(popupVideo.currentTime);
        }

        function showSeekToast(direction) {
          const toast = direction > 0 ? seekToastFwd : seekToastBack;

          seekToastFwd.classList.remove("show");
          seekToastBack.classList.remove("show");
          toast.classList.add("show");

          clearTimeout(seekToastTimer);

          seekToastTimer = setTimeout(() => {
            toast.classList.remove("show");
          }, 600);
        }

        function skipTime(seconds) {
          if (!popupVideo.duration) return;

          let newTime = popupVideo.currentTime + seconds;

          if (newTime < 0) newTime = 0;
          if (newTime > popupVideo.duration) newTime = popupVideo.duration;

          popupVideo.currentTime = newTime;

          updateProgress();
          showSeekToast(seconds);
          showControlsTemporarily();
        }

        function seekFromProgress() {
          if (!popupVideo.duration) return;

          const newTime =
            (Number(videoProgress.value) / 100) * popupVideo.duration;

          popupVideo.currentTime = newTime;
          currentTimeText.textContent = formatTime(newTime);
        }

        function previewSeekTime() {
          if (!popupVideo.duration) return;

          const previewTime =
            (Number(videoProgress.value) / 100) * popupVideo.duration;

          currentTimeText.textContent = formatTime(previewTime);
        }

        function updateMuteIcon() {
          if (popupVideo.muted || popupVideo.volume === 0) {
            muteIcon.className = "fa-solid fa-volume-xmark";
          } else if (popupVideo.volume < 0.5) {
            muteIcon.className = "fa-solid fa-volume-low";
          } else {
            muteIcon.className = "fa-solid fa-volume-high";
          }
        }

        function toggleMute() {
          if (popupVideo.muted || popupVideo.volume === 0) {
            popupVideo.muted = false;
            popupVideo.volume = lastVolume || 1;
            volumeRange.value = popupVideo.volume;
          } else {
            lastVolume = popupVideo.volume;
            popupVideo.muted = true;
            volumeRange.value = 0;
          }

          updateMuteIcon();
        }

        function changeVolume() {
          const volumeValue = Number(volumeRange.value);

          popupVideo.volume = volumeValue;
          popupVideo.muted = volumeValue === 0;

          if (volumeValue > 0) lastVolume = volumeValue;

          updateMuteIcon();
        }

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            videoBox.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        }

        function updateFullscreenIcon() {
          fullscreenIcon.className = document.fullscreenElement
            ? "fa-solid fa-compress"
            : "fa-solid fa-expand";
        }

        // ===== Open button =====
        videoPlayBtn.addEventListener("click", () => {
          playAudio(topicAudio);

          setTimeout(() => {
            openVideoPopup();
          }, 400);
        });

        videoPlayBtn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.code === "Space") {
            e.preventDefault();
            videoPlayBtn.click();
          }
        });

        // ===== Close =====
        closeVideo.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          closeVideoPopup();
        });

        videoOverlay.addEventListener("click", (e) => {
          if (e.target === videoOverlay) closeVideoPopup();
        });

        // ===== Video events =====
        popupVideo.addEventListener("click", togglePlay);

        popupVideo.addEventListener("play", () => {
          updatePlayIcons();
          showControlsTemporarily();
        });

        popupVideo.addEventListener("pause", () => {
          updatePlayIcons();
          showControlsTemporarily();
        });

        popupVideo.addEventListener("ended", updatePlayIcons);
        popupVideo.addEventListener("timeupdate", updateProgress);
        popupVideo.addEventListener("loadedmetadata", updateProgress);
        popupVideo.addEventListener("durationchange", updateProgress);
        popupVideo.addEventListener("seeked", updateProgress);

        popupVideo.addEventListener("contextmenu", (e) => e.preventDefault());

        popupVideo.addEventListener("dblclick", (e) => {
          const rect = popupVideo.getBoundingClientRect();
          const clickX = e.clientX - rect.left;

          if (clickX < rect.width / 2) {
            skipTime(-SKIP_SECONDS);
          } else {
            skipTime(SKIP_SECONDS);
          }
        });

        popupVideo.addEventListener("error", () => {
          console.error(
            "The video could not be loaded. Check the file path and video format.",
          );
        });

        // ===== Controls =====
        centerPlayBtn.addEventListener("click", togglePlay);
        playPauseBtn.addEventListener("click", togglePlay);
        rewindBtn.addEventListener("click", () => skipTime(-SKIP_SECONDS));
        forwardBtn.addEventListener("click", () => skipTime(SKIP_SECONDS));
        muteBtn.addEventListener("click", toggleMute);
        volumeRange.addEventListener("input", changeVolume);
        fullscreenBtn.addEventListener("click", toggleFullscreen);

        // ===== Progress drag / click =====
        videoProgress.addEventListener("pointerdown", () => {
          isSeeking = true;
        });

        videoProgress.addEventListener("input", () => {
          isSeeking = true;
          previewSeekTime();
        });

        videoProgress.addEventListener("change", () => {
          seekFromProgress();
          isSeeking = false;
          showControlsTemporarily();
        });

        document.addEventListener("pointerup", () => {
          if (isSeeking) {
            seekFromProgress();
            isSeeking = false;
            showControlsTemporarily();
          }
        });

        videoFrame.addEventListener("mousemove", showControlsTemporarily);
        videoFrame.addEventListener("click", showControlsTemporarily);

        document.addEventListener("fullscreenchange", updateFullscreenIcon);

        // ===== Keyboard shortcuts =====
        document.addEventListener("keydown", (e) => {
          if (!videoOverlay.classList.contains("show")) return;

          if (e.key === "Escape") {
            closeVideoPopup();
            return;
          }

          if (e.code === "Space") {
            e.preventDefault();
            togglePlay();
          }

          if (e.key === "ArrowRight") {
            e.preventDefault();
            skipTime(SKIP_SECONDS);
          }

          if (e.key === "ArrowLeft") {
            e.preventDefault();
            skipTime(-SKIP_SECONDS);
          }

          if (e.key.toLowerCase() === "m") toggleMute();
          if (e.key.toLowerCase() === "f") toggleFullscreen();
        });

        updatePlayIcons();
        updateMuteIcon();
      });
    </script>
  </body>
</html>
